name: Hourly DB ICE fare scan
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      telegram_test:
        description: Send only the safe Telegram test message; do not scan fares
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: db-ice-fare-scan
  cancel-in-progress: false
jobs:
  telegram-test:
    if: github.event_name == 'workflow_dispatch' && inputs.telegram_test == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Send safe Telegram test
        run: python db_monitor.py --telegram-test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  monitor:
    if: github.event_name != 'workflow_dispatch' || inputs.telegram_test != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Validate monitor helpers
        run: python -m pytest -q tests/test_db_monitor.py
      - name: Scan every remaining date independently
        run: |
          if [[ "$ENABLE_TELEGRAM_ALERTS" == "true" ]]; then
            python db_monitor.py --report-dir artifacts --max-runtime-minutes 52 --send-telegram-alerts
          else
            python db_monitor.py --report-dir artifacts --max-runtime-minutes 52
          fi
        env:
          ENABLE_TELEGRAM_ALERTS: ${{ vars.ENABLE_TELEGRAM_ALERTS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Upload reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-ice-scan-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
